openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: registrations
    description: Registration operations
  - name: badges
    description: Attendee badge upload and delivery operations
  - name: testimonies
    description: Testimony operations
  - name: prayer-chain
    description: Prayer Charge prayer-chain signup operations
  - name: merch
    description: Merch preorder operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /registrations:
    post:
      operationId: createRegistration
      tags: [registrations]
      summary: Register for the conference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listRegistrations
      tags: [registrations]
      summary: List all registrations (admin)
      responses:
        "200":
          description: List of registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registration"
  /registrations/{registrationId}:
    delete:
      operationId: deleteRegistration
      tags: [registrations]
      summary: Delete a registration (admin)
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "204":
          description: Registration deleted
        "400":
          description: Invalid registration ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registrations/badge-request:
    post:
      operationId: requestExistingRegistrationBadge
      tags: [badges]
      summary: Request an attendee badge for an existing registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistingRegistrationBadgeInput"
      responses:
        "200":
          description: Short-lived authorization for creating an attendee badge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeAccess"
        "400":
          description: Invalid badge request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Matching registration was not found or is not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registrations/{registrationId}/badge/upload-url:
    post:
      operationId: requestRegistrationBadgeUploadUrl
      tags: [badges]
      summary: Request a private attendee photo upload URL
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeUploadInput"
      responses:
        "200":
          description: Short-lived URL for uploading the attendee portrait
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeUploadUrl"
        "400":
          description: Invalid badge upload request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired badge authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registrations/{registrationId}/badge/complete:
    post:
      operationId: completeRegistrationBadge
      tags: [badges]
      summary: Create and deliver an attendee badge
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeCompleteInput"
      responses:
        "200":
          description: Badge delivered in the confirmation email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "202":
          description: Registration was confirmed but badge generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Invalid badge completion request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired badge authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registrations/{registrationId}/badge/skip:
    post:
      operationId: skipRegistrationBadge
      tags: [badges]
      summary: Send the standard confirmation without an attendee badge
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeSkipInput"
      responses:
        "200":
          description: Standard confirmation delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "401":
          description: Invalid or expired badge authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /testimonies:
    post:
      operationId: createTestimony
      tags: [testimonies]
      summary: Submit a testimony
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonyInput"
      responses:
        "201":
          description: Testimony submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimony"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listTestimonies
      tags: [testimonies]
      summary: List all testimonies
      responses:
        "200":
          description: List of testimonies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimony"
  /prayer-chain-signups:
    post:
      operationId: createPrayerChainSignup
      tags: [prayer-chain]
      summary: Join one or more Prayer Charge time slots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerChainSignupInput"
      responses:
        "201":
          description: Prayer-chain signup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerChainSignup"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listPrayerChainSignups
      tags: [prayer-chain]
      summary: List prayer-chain signups for the admin area
      responses:
        "200":
          description: Prayer-chain signup list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrayerChainSignup"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merch-orders:
    post:
      operationId: createMerchOrder
      tags: [merch]
      summary: Submit a merch preorder after Cash App payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchOrderInput"
      responses:
        "201":
          description: Merch preorder received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchOrder"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listMerchOrders
      tags: [merch]
      summary: List merch preorders for the admin area
      responses:
        "200":
          description: Merch preorder list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchOrder"
  /merch-orders/{id}/verify:
    patch:
      operationId: confirmMerchOrderPayment
      tags: [merch]
      summary: Confirm a merch preorder payment after Cash App review
      parameters:
        - $ref: "#/components/parameters/MerchOrderId"
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchOrder"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Merch preorder not found
        "409":
          description: Preorder is already verified
        "502":
          description: Payment verified but email delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchOrderEmailError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Registration:
      type: object
      required: [id, firstName, lastName, email, conferenceYear, volunteer, createdAt]
      properties:
        id:             { type: integer }
        firstName:      { type: string }
        lastName:       { type: string }
        email:          { type: string }
        phone:          { type: ["string", "null"] }
        conferenceYear: { type: integer }
        volunteer:      { type: boolean }
        volunteerRole:  { type: ["string", "null"] }
        badgeDeliveryStatus:
          type: string
          enum: [delivered, fallback]
        createdAt:      { type: string, format: date-time }
    RegistrationCreated:
      allOf:
        - $ref: "#/components/schemas/Registration"
        - type: object
          properties:
            badgeUploadToken:
              type: string
    RegistrationInput:
      type: object
      required: [firstName, lastName, email, conferenceYear]
      properties:
        firstName:      { type: string, minLength: 1 }
        lastName:       { type: string, minLength: 1 }
        email:          { type: string, format: email }
        phone:          { type: string }
        conferenceYear: { type: integer }
        volunteer:      { type: boolean }
        volunteerRole:  { type: string }
        wantsAttendeeBadge:
          type: boolean
          description: Whether a portrait will be uploaded to create an attendee badge.
        plusOne:
          $ref: "#/components/schemas/PlusOneInput"
    PlusOneInput:
      type: object
      description: An optional additional attendee registered with the primary attendee.
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName:  { type: string, minLength: 1 }
        email:     { type: string, format: email }
        phone:     { type: string }
    ExistingRegistrationBadgeInput:
      type: object
      required: [firstName, lastName, email, conferenceYear]
      properties:
        firstName:      { type: string, minLength: 1 }
        lastName:       { type: string, minLength: 1 }
        email:          { type: string, format: email }
        conferenceYear: { type: integer }
    BadgeAccess:
      type: object
      required: [registrationId, badgeUploadToken]
      properties:
        registrationId: { type: integer }
        badgeUploadToken: { type: string }
    BadgeUploadInput:
      type: object
      required: [token, name, size, contentType]
      properties:
        token:       { type: string, minLength: 32 }
        name:        { type: string, minLength: 1, maxLength: 200 }
        size:        { type: integer, minimum: 1, maximum: 5242880 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    BadgeUploadUrl:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:  { type: string, format: uri }
        objectPath: { type: string }
    BadgeCompleteInput:
      type: object
      required: [token, objectPath]
      properties:
        token:      { type: string, minLength: 32 }
        objectPath: { type: string, minLength: 1 }
    BadgeSkipInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32 }
    Testimony:
      type: object
      required: [id, name, email, conferenceYear, testimony, createdAt]
      properties:
        id:             { type: integer }
        name:           { type: string }
        email:          { type: string }
        conferenceYear: { type: integer }
        testimony:      { type: string }
        createdAt:      { type: string, format: date-time }
    TestimonyInput:
      type: object
      required: [conferenceYear, testimony]
      properties:
        conferenceYear: { type: integer }
        testimony:      { type: string, minLength: 10 }
    PrayerChainSignup:
      type: object
      required: [id, name, email, phone, timeSlots, createdAt]
      properties:
        id:        { type: integer }
        name:      { type: string }
        email:     { type: string, format: email }
        phone:     { type: string }
        timeSlots:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    PrayerChainSignupInput:
      type: object
      required: [name, email, phone, timeSlots]
      properties:
        name:  { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 7, maxLength: 40 }
        timeSlots:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            enum:
              - "00:00"
              - "01:00"
              - "02:00"
              - "03:00"
              - "04:00"
              - "05:00"
              - "06:00"
              - "07:00"
              - "08:00"
              - "09:00"
              - "10:00"
              - "11:00"
    MerchOrderItem:
      type: object
      required: [productName, size, quantity]
      properties:
        productName: { type: string, minLength: 1 }
        size: { type: string, enum: [S, M, L, XL, XXL] }
        quantity: { type: integer, minimum: 1 }
    MerchOrder:
      type: object
      required: [id, name, email, paymentReference, items, total, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        paymentReference: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/MerchOrderItem"
        total: { type: integer }
        status: { type: string, enum: [awaiting_verification, verified] }
        paymentConfirmedAt: { type: ["string", "null"], format: date-time }
        paymentConfirmedBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    MerchOrderInput:
      type: object
      required: [name, email, paymentReference, items, total]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 40 }
        paymentReference: { type: string, minLength: 1, maxLength: 120 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MerchOrderItem"
        total: { type: integer, minimum: 1 }
    MerchOrderEmailError:
      type: object
      required: [error, order]
      properties:
        error: { type: string }
        order:
          $ref: "#/components/schemas/MerchOrder"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
  parameters:
    MerchOrderId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: integer
