openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: registrations
    description: Registration operations
  - name: check-in
    description: Admin-configured conference sessions and attendee check-ins
  - name: badges
    description: Attendee badge upload and delivery operations
  - name: testimonies
    description: Testimony operations
  - name: prayer-chain
    description: Prayer Charge prayer-chain signup operations
  - name: prayer-charge-survey
    description: Post-event Prayer Charge survey responses
  - name: merch
    description: Merch preorder operations
  - name: admin
    description: Admin sign-in and account management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /registrations:
    post:
      operationId: createRegistration
      tags: [registrations]
      summary: Register for the conference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listRegistrations
      tags: [registrations]
      summary: List all registrations (admin)
      responses:
        "200":
          description: List of registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registration"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registrations/{registrationId}:
    delete:
      operationId: deleteRegistration
      tags: [registrations]
      summary: Delete a registration (admin)
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "204":
          description: Registration deleted
        "400":
          description: Invalid registration ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registrations/badge-request:
    post:
      operationId: requestExistingRegistrationBadge
      tags: [badges]
      summary: Request an attendee badge for an existing registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistingRegistrationBadgeInput"
      responses:
        "200":
          description: Short-lived authorization for creating an attendee badge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeAccess"
        "400":
          description: Invalid badge request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Matching registration was not found or is not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registrations/{registrationId}/badge/upload-url:
    post:
      operationId: requestRegistrationBadgeUploadUrl
      tags: [badges]
      summary: Request a private attendee photo upload URL
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeUploadInput"
      responses:
        "200":
          description: Short-lived URL for uploading the attendee portrait
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeUploadUrl"
        "400":
          description: Invalid badge upload request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired badge authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registrations/{registrationId}/badge/complete:
    post:
      operationId: completeRegistrationBadge
      tags: [badges]
      summary: Create and deliver an attendee badge
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeCompleteInput"
      responses:
        "200":
          description: Badge delivered in the confirmation email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "202":
          description: Registration was confirmed but badge generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Invalid badge completion request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired badge authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registrations/{registrationId}/badge/skip:
    post:
      operationId: skipRegistrationBadge
      tags: [badges]
      summary: Send the standard confirmation without an attendee badge
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeSkipInput"
      responses:
        "200":
          description: Standard confirmation delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "401":
          description: Invalid or expired badge authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /check-in-sessions:
    get:
      operationId: listCheckInSessions
      tags: [check-in]
      summary: List conference check-in sessions (admin)
      responses:
        "200":
          description: Configured check-in sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckInSession"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCheckInSession
      tags: [check-in]
      summary: Create a conference check-in session (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInSessionInput"
      responses:
        "201":
          description: Check-in session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInSession"
        "400":
          description: Invalid check-in session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A session with this name already exists for that date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /check-in-sessions/{sessionId}:
    delete:
      operationId: deleteCheckInSession
      tags: [check-in]
      summary: Delete a check-in session that has no attendees checked in (admin)
      parameters:
        - $ref: "#/components/parameters/CheckInSessionId"
      responses:
        "204":
          description: Check-in session deleted
        "400":
          description: Invalid session ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Check-in session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session has active check-ins and cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /check-in-sessions/{sessionId}/check-ins:
    get:
      operationId: listSessionCheckIns
      tags: [check-in]
      summary: List attendees checked in to a session (admin)
      parameters:
        - $ref: "#/components/parameters/CheckInSessionId"
      responses:
        "200":
          description: Attendees checked in to this session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegistrationCheckIn"
        "400":
          description: Invalid session ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Check-in session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /check-in-sessions/{sessionId}/scan:
    post:
      operationId: scanCheckInQr
      tags: [check-in]
      summary: Check an attendee in by scanning their QR code (admin)
      parameters:
        - $ref: "#/components/parameters/CheckInSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInQrScanInput"
      responses:
        "201":
          description: Attendee checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCheckIn"
        "400":
          description: Invalid session ID or QR payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: QR code is not valid for this conference session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Attendee is already checked in to this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /check-in-sessions/{sessionId}/registrations/{registrationId}/qr-email:
    post:
      operationId: sendRegistrationCheckInQr
      tags: [check-in]
      summary: Email a replacement attendee QR code (admin)
      parameters:
        - $ref: "#/components/parameters/CheckInSessionId"
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "204":
          description: Replacement QR code emailed
        "400":
          description: Invalid session or registration ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Registration or matching session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: QR email could not be delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /check-in-sessions/{sessionId}/registrations/{registrationId}/check-in:
    post:
      operationId: checkInRegistration
      tags: [check-in]
      summary: Check a registered attendee into a session (admin)
      parameters:
        - $ref: "#/components/parameters/CheckInSessionId"
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "201":
          description: Attendee checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCheckIn"
        "400":
          description: Invalid session or registration ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Registration or matching session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Attendee is already checked in to this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: undoRegistrationCheckIn
      tags: [check-in]
      summary: Undo an attendee check-in (admin)
      parameters:
        - $ref: "#/components/parameters/CheckInSessionId"
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "204":
          description: Check-in undone
        "400":
          description: Invalid session or registration ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Check-in not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /testimonies:
    post:
      operationId: createTestimony
      tags: [testimonies]
      summary: Submit a testimony
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonyInput"
      responses:
        "201":
          description: Testimony submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimony"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listTestimonies
      tags: [testimonies]
      summary: List all testimonies
      responses:
        "200":
          description: List of testimonies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimony"
  /prayer-chain-signups:
    post:
      operationId: createPrayerChainSignup
      tags: [prayer-chain]
      deprecated: true
      summary: Prayer Charge sign-ups are closed
      responses:
        "410":
          description: Prayer Charge sign-ups are closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listPrayerChainSignups
      tags: [prayer-chain]
      summary: List prayer-chain signups for the admin area
      responses:
        "200":
          description: Prayer-chain signup list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrayerChainSignup"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /prayer-charge-survey-responses:
    post:
      operationId: createPrayerChargeSurveyResponse
      tags: [prayer-charge-survey]
      summary: Submit anonymous Prayer Charge feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerChargeSurveyResponseInput"
      responses:
        "201":
          description: Survey response saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerChargeSurveyResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listPrayerChargeSurveyResponses
      tags: [prayer-charge-survey]
      summary: List survey responses for the admin area
      responses:
        "200":
          description: Prayer Charge survey responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrayerChargeSurveyResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /first-timer-responses:
    post:
      operationId: createFirstTimerResponse
      tags: [first-timers]
      summary: Submit a first-timer response for a conference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirstTimerResponseInput"
      responses:
        "201":
          description: First-timer response created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstTimerResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A response already exists for this email and conference year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listFirstTimerResponses
      tags: [first-timers]
      summary: List first-timer responses for the admin area
      responses:
        "200":
          description: First-timer response list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FirstTimerResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Validate the current admin session
      responses:
        "200":
          description: Current signed-in admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: logoutAdmin
      tags: [admin]
      summary: Clear the current admin session
      responses:
        "200":
          description: Admin session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLogoutResponse"
  /admin/login:
    post:
      operationId: loginAdmin
      tags: [admin]
      summary: Sign in to the admin dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Sign-in succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "400":
          description: Invalid login request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List configured admin accounts
      responses:
        "200":
          description: Admin account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Add another admin account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: Admin account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merch-orders:
    post:
      operationId: createMerchOrder
      tags: [merch]
      summary: Submit a merch preorder after Cash App payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchOrderInput"
      responses:
        "201":
          description: Merch preorder received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchOrder"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listMerchOrders
      tags: [merch]
      summary: List merch preorders for the admin area
      responses:
        "200":
          description: Merch preorder list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchOrder"
  /merch-orders/{id}/verify:
    patch:
      operationId: confirmMerchOrderPayment
      tags: [merch]
      summary: Confirm a merch preorder payment after Cash App review
      parameters:
        - $ref: "#/components/parameters/MerchOrderId"
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchOrder"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Merch preorder not found
        "409":
          description: Preorder is already verified
        "502":
          description: Payment verified but email delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchOrderEmailError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Registration:
      type: object
      required: [id, firstName, lastName, email, conferenceYear, volunteer, createdAt]
      properties:
        id:             { type: integer }
        firstName:      { type: string }
        lastName:       { type: string }
        email:          { type: string }
        phone:          { type: ["string", "null"] }
        smsConsent:     { type: boolean }
        conferenceYear: { type: integer }
        volunteer:      { type: boolean }
        volunteerRole:  { type: ["string", "null"] }
        badgeDeliveryStatus:
          type: string
          enum: [delivered, fallback]
        createdAt:      { type: string, format: date-time }
    RegistrationCreated:
      allOf:
        - $ref: "#/components/schemas/Registration"
        - type: object
          properties:
            badgeUploadToken:
              type: string
    RegistrationInput:
      type: object
      required: [firstName, lastName, email, conferenceYear]
      properties:
        firstName:      { type: string, minLength: 1 }
        lastName:       { type: string, minLength: 1 }
        email:          { type: string, format: email }
        phone:          { type: string }
        smsConsent:     { type: boolean, description: Whether the attendee opted in to receive SMS updates. }
        conferenceYear: { type: integer }
        volunteer:      { type: boolean }
        volunteerRole:  { type: string }
        wantsAttendeeBadge:
          type: boolean
          description: Whether a portrait will be uploaded to create an attendee badge.
        plusOne:
          $ref: "#/components/schemas/PlusOneInput"
    CheckInSession:
      type: object
      required: [id, conferenceYear, sessionDate, name, createdAt, createdBy]
      properties:
        id: { type: integer }
        conferenceYear: { type: integer }
        sessionDate:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
          description: Calendar date in YYYY-MM-DD format
        name: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
    CheckInSessionInput:
      type: object
      required: [conferenceYear, sessionDate, name]
      properties:
        conferenceYear: { type: integer, minimum: 2000, maximum: 2200 }
        sessionDate:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
          description: Calendar date in YYYY-MM-DD format
        name: { type: string, minLength: 1, maxLength: 100 }
    RegistrationCheckIn:
      type: object
      required: [id, sessionId, registrationId, checkedInAt, checkedInBy]
      properties:
        id: { type: integer }
        sessionId: { type: integer }
        registrationId: { type: integer }
        checkedInAt: { type: string, format: date-time }
        checkedInBy: { type: string }
    CheckInQrScanInput:
      type: object
      required: [payload]
      properties:
        payload:
          type: string
          pattern: '^shalom-checkin:v1:[A-Za-z0-9_-]{43}$'
          description: Opaque attendee QR payload; contains no attendee details or database identifiers.
    PlusOneInput:
      type: object
      description: An optional additional attendee registered with the primary attendee.
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName:  { type: string, minLength: 1 }
        email:     { type: string, format: email }
        phone:     { type: string }
    ExistingRegistrationBadgeInput:
      type: object
      required: [firstName, lastName, email, conferenceYear]
      properties:
        firstName:      { type: string, minLength: 1 }
        lastName:       { type: string, minLength: 1 }
        email:          { type: string, format: email }
        conferenceYear: { type: integer }
    BadgeAccess:
      type: object
      required: [registrationId, badgeUploadToken]
      properties:
        registrationId: { type: integer }
        badgeUploadToken: { type: string }
    BadgeUploadInput:
      type: object
      required: [token, name, size, contentType]
      properties:
        token:       { type: string, minLength: 32 }
        name:        { type: string, minLength: 1, maxLength: 200 }
        size:        { type: integer, minimum: 1, maximum: 5242880 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    BadgeUploadUrl:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:  { type: string, format: uri }
        objectPath: { type: string }
    BadgeCompleteInput:
      type: object
      required: [token, objectPath]
      properties:
        token:      { type: string, minLength: 32 }
        objectPath: { type: string, minLength: 1 }
    BadgeSkipInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32 }
    Testimony:
      type: object
      required: [id, name, email, conferenceYear, testimony, createdAt]
      properties:
        id:             { type: integer }
        name:           { type: string }
        email:          { type: string }
        conferenceYear: { type: integer }
        testimony:      { type: string }
        createdAt:      { type: string, format: date-time }
    TestimonyInput:
      type: object
      required: [conferenceYear, testimony]
      properties:
        conferenceYear: { type: integer }
        testimony:      { type: string, minLength: 10 }
    PrayerChainSignup:
      type: object
      required: [id, name, email, phone, timeSlots, createdAt]
      properties:
        id:        { type: integer }
        name:      { type: string }
        email:     { type: string, format: email }
        phone:     { type: string }
        timeSlots:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    PrayerChainSignupInput:
      type: object
      required: [name, email, phone, timeSlots]
      properties:
        name:  { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 7, maxLength: 40 }
        timeSlots:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            enum:
              - "00:00"
              - "01:00"
              - "02:00"
              - "03:00"
              - "04:00"
              - "05:00"
              - "06:00"
              - "07:00"
              - "08:00"
              - "09:00"
              - "10:00"
              - "11:00"
    PrayerChargeSurveyResponse:
      type: object
      required: [id, rating, meaningfulMoment, suggestion, wouldAttendAgain, createdAt]
      properties:
        id:                { type: integer }
        rating:            { type: integer, minimum: 1, maximum: 5 }
        meaningfulMoment:  { type: string }
        suggestion:        { type: string }
        wouldAttendAgain:  { type: string, enum: [yes, maybe, no] }
        createdAt:         { type: string, format: date-time }
    PrayerChargeSurveyResponseInput:
      type: object
      required: [rating, wouldAttendAgain]
      properties:
        rating:           { type: integer, minimum: 1, maximum: 5 }
        meaningfulMoment: { type: string, maxLength: 1200 }
        suggestion:       { type: string, maxLength: 1200 }
        wouldAttendAgain: { type: string, enum: [yes, maybe, no] }
    FirstTimerResponse:
      type: object
      required: [id, name, email, isFirstTime, conferenceYear, createdAt]
      properties:
        id:             { type: integer }
        name:           { type: string }
        email:          { type: string, format: email }
        isFirstTime:    { type: boolean }
        conferenceYear: { type: integer }
        createdAt:      { type: string, format: date-time }
    FirstTimerResponseInput:
      type: object
      required: [name, email, isFirstTime, conferenceYear]
      properties:
        name:           { type: string, minLength: 1, maxLength: 160 }
        email:          { type: string, format: email, maxLength: 254 }
        isFirstTime:    { type: boolean }
        conferenceYear: { type: integer, minimum: 2000, maximum: 2100 }
    AdminUser:
      type: object
      required: [id, username, createdAt]
      properties:
        id:        { type: integer }
        username:  { type: string }
        createdAt: { type: string, format: date-time }
    AdminUserInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 200 }
    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
    AdminLoginResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    AdminSession:
      type: object
      required: [ok, username]
      properties:
        ok: { type: boolean }
        username: { type: string }
    AdminLogoutResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    MerchOrderItem:
      type: object
      required: [productName, size, quantity]
      properties:
        productName: { type: string, minLength: 1 }
        size: { type: string, enum: [S, M, L, XL, XXL] }
        quantity: { type: integer, minimum: 1 }
    MerchOrder:
      type: object
      required: [id, name, email, paymentReference, items, total, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        paymentReference: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/MerchOrderItem"
        total: { type: integer }
        status: { type: string, enum: [awaiting_verification, verified] }
        paymentConfirmedAt: { type: ["string", "null"], format: date-time }
        paymentConfirmedBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    MerchOrderInput:
      type: object
      required: [name, email, paymentReference, items, total]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 40 }
        paymentReference: { type: string, minLength: 1, maxLength: 120 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MerchOrderItem"
        total: { type: integer, minimum: 1 }
    MerchOrderEmailError:
      type: object
      required: [error, order]
      properties:
        error: { type: string }
        order:
          $ref: "#/components/schemas/MerchOrder"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
  parameters:
    CheckInSessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    MerchOrderId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: integer
