<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Apply the saved theme before first paint to avoid a flash on navigation.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("shalom-theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
      document.documentElement.style.colorScheme = document.documentElement.dataset.theme;
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Shalom Youth Conference</title>
    <meta name="description" content="Shalom is an annual worship and prayer conference for students and young adults in Windsor Mill, Maryland." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Shalom Youth Conference" />
    <meta property="og:description" content="An annual gathering for students and young adults to worship, pray, and encounter God together." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/home/shalom-2026-prayer-1.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shalom Youth Conference" />
    <meta name="twitter:description" content="An annual gathering for students and young adults to worship, pray, and encounter God together." />
    <meta name="twitter:image" content="/images/home/shalom-2026-prayer-1.jpg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Home hero first-paint image. -->
    <link
      rel="preload"
      as="image"
      href="/images/home/shalom-2026-prayer-1.jpg"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
